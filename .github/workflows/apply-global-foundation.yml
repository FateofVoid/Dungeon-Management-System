name: Apply DMS Global Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/global-foundation-persistence
    paths:
      - scripts/apply-global-foundation.cjs
      - test/dms-foundation.test.cjs
      - .github/workflows/apply-global-foundation.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-foundation-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply foundation patch
        run: node scripts/apply-global-foundation.cjs
      - name: Syntax and regression tests
        run: npm run check
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Commit generated Library.js
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- Library.js; then
            echo "Library.js already contains the foundation patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.js
          git commit -m "feat: implement DMS global foundation persistence"
          git push origin HEAD:feature/global-foundation-persistence

# This workflow is intentionally one-shot infrastructure for applying the large Library.js patch safely.
