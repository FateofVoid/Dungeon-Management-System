name: Apply DMS Global Foundation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/global-foundation-persistence
    paths:
      - scripts/complete-global-foundation.cjs
      - test/dms-foundation.test.cjs
      - .github/workflows/apply-global-foundation.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/global-foundation-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply final foundation safeguards
        run: node scripts/complete-global-foundation.cjs
      - name: Syntax and regression tests
        run: |
          node --check Library.js
          node --check Input.js
          node --check Context.js
          node --check Output.js
          npm test
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Commit completed Library.js
        run: |
          if git diff --quiet -- Library.js; then
            echo "Library.js already contains the completion patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Library.js
          git commit -m "fix: complete DMS foundation safeguards"
          git push origin HEAD:feature/global-foundation-persistence
